<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Production Company in Richmond, VA | Vyewfinder Films</title>
    <meta name="description" content="Vyewfinder Films is an audiovisual production company in Richmond, VA. We create video, photography, and podcast content that makes clients choose you. Est. 2017." />
    <link rel="icon" type="image/png" href="/images/logo_isotype_2.svg" />
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
      /* Applies the saved theme before first paint. Without this the
         loader renders in the wrong theme for a frame and then snaps.
         Must stay in sync with DEFAULT_THEME in src/context/ThemeContext. */
      (function () {
        try {
          var m = document.cookie.match(/(?:^|; )vf-theme=([^;]*)/);
          var stored = m ? decodeURIComponent(m[1]) : null;
          var theme = (stored === 'light' || stored === 'dark') ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <!-- LocalBusiness structured data. Hand-authored and static on
         purpose: it does not vary by route or by language, and it has to
         be readable by a crawler that never executes our JS.

         Values duplicated from elsewhere in the repo, because
         index.html cannot import a JS module. If any of these change,
         change them in both places:
           telephone / email  -> BUSINESS_PHONE_E164, BUSINESS_EMAIL
                                 in src/utils/leads.js (source of truth)
           opening hours      -> footer.hours.* in
                                 src/locales/{en,es}/translation.json
           sameAs URLs        -> the social links in
                                 src/components/Footer.jsx -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://vyewfinderfilms.com/#business",
        "name": "Vyewfinder Films",
        "description": "Audiovisual production company — video, photography, social media content, and podcast production.",
        "url": "https://vyewfinderfilms.com",
        "telephone": "+1-804-998-0564",
        "email": "info@vyewfinderfilms.com",
        "foundingDate": "2017",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Richmond",
          "addressRegion": "VA",
          "addressCountry": "US"
        },
        "areaServed": {
          "@type": "City",
          "name": "Richmond",
          "containedInPlace": {
            "@type": "State",
            "name": "Virginia"
          }
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "19:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "17:00"
          }
        ],
        "sameAs": [
          "https://www.facebook.com/vyewfinderfilmsrva/",
          "https://www.instagram.com/vyewfinderfilms/",
          "https://www.youtube.com/@vyewfinderfilmsrva",
          "https://www.tiktok.com/@vyewfinderfilms"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
