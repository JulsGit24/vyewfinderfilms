<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vyewfinder Films | Audiovisual Production Company</title>
    <meta name="description" content="Vyewfinder Films is an audiovisual production company creating video, photography, and podcast content that makes people choose you. Est. 2017, Richmond, VA." />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
      /* Applies the saved theme before first paint. Without this the
         loader renders in the wrong theme for a frame and then snaps.
         Must stay in sync with DEFAULT_THEME in src/context/ThemeContext. */
      (function () {
        try {
          var m = document.cookie.match(/(?:^|; )vf-theme=([^;]*)/);
          var stored = m ? decodeURIComponent(m[1]) : null;
          var theme = (stored === 'light' || stored === 'dark') ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
